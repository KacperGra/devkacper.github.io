name: Update Steam release dates

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-release-dates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Fetch release dates from Steam and update pages
        run: node scripts/update-release-dates.mjs

      - name: Commit changes if release dates changed
        run: |
          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add games/dunhero.html games/emojis-vs-zombies.html
          git commit -m "chore: sync release dates from Steam"
          git push
